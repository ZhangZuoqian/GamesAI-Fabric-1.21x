# Gradle build options only.
# Mod/loader/minecraft versions live in stonecutter.properties.toml (centralized by Stonecutter).

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G

# HTTP proxy: this sandbox routes outbound HTTPS through a local proxy that curl
# picks up via env vars, but the Gradle daemon does not read them automatically.
# Configure the proxy explicitly so artifact resolution works.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
# Increase socket timeouts: the sandbox proxy is slow for large artifact downloads
# (MC dependencies). Default 30s causes "Read timed out" on ~50MB jars.
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=120000
# Build chiseled nodes in parallel where possible.
org.gradle.parallel=true
# Reuse task outputs between runs.
org.gradle.caching=true
# Acknowledge that this project intentionally uses Groovy DSL with Stonecutter
# (see https://stonecutter.kikugie.dev/wiki/faq#groovy-support) and silence the warning.
dev.kikugie.stonecutter.hard_mode=true
